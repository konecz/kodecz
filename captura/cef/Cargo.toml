[package]
name = "captura"
version = "0.1.0"
edition = "2024"

# P02: host nativo da captura pelo CEF 156 (OSR + shared texture). O quadro vai direto ao núcleo do módulo do M02
# (Vulkan → CUDA → NVENC, marca), incluído sem cópia por #[path] e com o napi desligado (feature `noop`).
# A orquestração continua em TypeScript (captura/cef/host.ts e electron-cef.ts), que fala com este host por linhas JSON.
# Dependências: docs/adr.md, seção 4.

[[bin]]
name = "motor-captura"
path = "src/main.rs"

# Processos filhos do CEF (renderer, GPU, utilitários): executável à parte, sem o NVENC (browser_subprocess_path).
[[bin]]
name = "motor-captura-filho"
path = "src/filho.rs"

[dependencies]
# Bindings do CEF para Rust (Tauri), na versão do CEF baixado (156.0.14). Sem as features padrão (sandbox, download,
# utilitários de build): o CEF vem de CEF_PATH (captura/cef/preparar-cef.sh).
cef = { version = "=156.2.0", default-features = false }
serde_json = "1"
# As do núcleo do M02 (as mesmas versões do nativo/Cargo.toml), só com a feature `placa`; o napi só com `noop`, sem Node.
ash = { version = "0.38", optional = true }
cudarc = { version = "0.16", default-features = false, features = ["std", "driver", "cuda-12080", "dynamic-loading"], optional = true }
nvidia-video-codec-sdk = { version = "0.4.0", optional = true }
napi = { version = "3", default-features = false, features = ["noop"], optional = true }
napi-derive = { version = "3", default-features = false, features = ["noop"], optional = true }

[features]
default = ["placa"]
# P14: o modo placa (o núcleo do M02: Vulkan → CUDA → NVENC e o NVDEC). O nvidia-video-codec-sdk liga em tempo de link
# em libnvidia-encode.so e libnvcuvid.so, que só existem com o driver NVIDIA; sem a feature
# (`captura/cef/montar.sh --no-default-features`), o host monta numa máquina sem driver, só com a captura por software
# (o paint BGRA do M06, o modo CPU), e recusa as operações do modo placa. O instalador escolhe pela sonda da placa.
placa = ["dep:ash", "dep:cudarc", "dep:nvidia-video-codec-sdk", "dep:napi", "dep:napi-derive"]

[profile.release]
debug = false
