<!doctype html>
<meta charset="utf-8">
<title>Conferência: zoom volta cedo</title>
<!-- S04: composição sintética em linha do tempo, 16:9, que quebra só a G21 (R01: nada de cliente).
     Apresentador: rosto.jpg (retrato de domínio público, node conferencia/preparar.ts). Punch-in de 1,2 em «muda»
     (quadro 27) que volta por duração fixa, 1 s depois (quadro 57), antes do ponto da frase (2,5 s = quadro 75).
     Legenda numa linha embaixo, longe do rosto. -->
<script type="application/json" id="motor-video">
{ "id": "ConfZoomCedo", "largura": 960, "altura": 540, "qps": 30, "quadros": 120 }
</script>
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #0d1020; font-family: sans-serif; }
  .palco { position: absolute; inset: 0; overflow: hidden; }
  .take { position: absolute; left: 264px; top: 0; width: 432px; height: 540px; transform-origin: 284px 145px; }
  .take img { width: 432px; height: 540px; display: block; }
  .legenda { position: absolute; left: 0; right: 0; top: 470px; text-align: center; color: #fff; font: 700 32px sans-serif;
             white-space: nowrap; text-shadow: 0 2px 6px #000; }
</style>
<div class="palco">
  <div class="take" id="take"><img data-papel="apresentador" src="rosto.jpg" alt=""></div>
</div>
<div class="legenda" data-papel="legenda">Isto muda tudo, de verdade.</div>
<script>
  const QPS = 30, QUADROS = 120, DUR = (QUADROS * 1000) / QPS;
  document.getElementById('take').animate([
    { transform: 'scale(1)', offset: 0 }, { transform: 'scale(1)', offset: 27 / QUADROS }, { transform: 'scale(1.2)', offset: 31 / QUADROS },
    { transform: 'scale(1.2)', offset: 57 / QUADROS }, { transform: 'scale(1)', offset: 61 / QUADROS }, { transform: 'scale(1)', offset: 1 },
  ], { duration: DUR, fill: 'both' });
  window.motor_falas = [
    { t: 'Isto', ini: 0.5, fim: 0.8, bloco: 1 }, { t: 'muda', ini: 0.8, fim: 1.2, bloco: 1 }, { t: 'tudo,', ini: 1.2, fim: 1.7, bloco: 1 },
    { t: 'de', ini: 1.8, fim: 1.95, bloco: 1 }, { t: 'verdade.', ini: 1.95, fim: 2.5, bloco: 1 },
    { t: 'Veja.', ini: 3.2, fim: 3.6, bloco: 2 },
  ];
</script>
