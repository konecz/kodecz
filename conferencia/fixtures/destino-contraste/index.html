<!doctype html>
<html data-destino="reels">
<meta charset="utf-8">
<title>Conferência: zona segura do Reels e contraste</title>
<!-- S04: composição sintética em linha do tempo, 9:16, com destino Reels declarado (data-destino no <html>), que quebra
     só a G19 (o rodapé na faixa de baixo que a interface do Reels cobre) e a G20 (cinza-claro sobre a placa branca,
     1,9:1 no fundo real); um texto claro, tapado por uma placa, e um texto escuro atrás de uma camada semitransparente que o cobre em parte não contam. Sem apresentador, sem legenda, sem fala (R01: nada de cliente). -->
<script type="application/json" id="motor-video">
{ "id": "ConfDestinoContraste", "largura": 810, "altura": 1440, "qps": 30, "quadros": 60 }
</script>
<style>
  html, body { margin: 0; width: 810px; height: 1440px; overflow: hidden; background: #0d1020; font-family: sans-serif; }
  .placa { position: absolute; left: 105px; top: 500px; width: 600px; padding: 20px 0; background: #ffffff; text-align: center; }
  .claro { color: #bbbbbb; font: 400 30px sans-serif; }
  /* Texto de contraste ruim, mas tapado por uma placa opaca por cima: não aparece, não conta na G20. */
  .tapado { position: absolute; left: 105px; top: 700px; width: 600px; text-align: center; color: #e6e6e6; font: 400 30px sans-serif; }
  .tampa { position: absolute; left: 80px; top: 680px; width: 650px; height: 80px; background: #f5f5f5; }
  /* Texto escuro sobre o fundo escuro (1,6:1), atrás de uma camada escura semitransparente que cobre parte dele (o
     fundo esmaecido de um modal): não é para ser lido, não conta na G20. */
  .esmaecido { position: absolute; left: 105px; top: 820px; width: 600px; text-align: center; color: #3a3d4d; font: 400 30px sans-serif; }
  .camada { position: absolute; left: 0; top: 800px; width: 405px; height: 80px; background: rgba(0, 0, 0, 0.5); }
  .rodape { position: absolute; left: 105px; width: 600px; top: 1250px; text-align: center; color: #ffffff; font: 700 40px sans-serif; }
</style>
<div class="placa"><span class="claro">Texto claro demais</span></div>
<div class="tapado">Texto escondido pela tampa</div>
<div class="tampa"></div>
<div class="esmaecido">Texto atrás da camada do modal</div>
<div class="camada"></div>
<div class="rodape">Rodapé embaixo da interface</div>
</html>
