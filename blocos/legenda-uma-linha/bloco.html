     Gerado por montar.ts (o `kodecz assemble` chama; KODECZ.md, «Como aplicar»): uma <p> por frase, montada pela largura
     medida no arquivo da fonte, com o ⟨inicio⟩ da primeira palavra (menos 0,05 s) e o ⟨fim⟩ no início da seguinte.

     q = round(s × fps). O texto vem do roteiro (G07); a vírgula sai da tela e fica em data-t.
     data-destaque="progresso" volta ao modo antigo; data-entrada="subir" sobe a frase 10 px ao entrar;
     data-ancora="topo" com --legenda-topo (9:16); senão --legenda-base (16:9, padrão 56 px, nunca abaixo de --spacing-safe). -->
