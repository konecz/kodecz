     ⟨valores⟩: números separados por espaço, na ordem do eixo x; ⟨maximo⟩: o topo do eixo y (≥ o maior valor).

        style="--inicio: ⟨inicio⟩; --duracao: ⟨duracao⟩; --sufixo: '⟨sufixo⟩'">
  <svg aria-hidden="true"><polyline class="kz-linha-traco" pathLength="1"></polyline></svg>
  <b class="kz-linha-num"></b>
</figure>
