<!-- faixa-do-tema (H14). <link rel="stylesheet" href="⟨blocos⟩/faixa-do-tema/bloco.css"> no <head>, junto com o da
     legenda (H01). Entra no ⟨inicio⟩ e começa a sair no ⟨fim⟩ (quadros): o fim da frase, o mesmo --fim do zoom (G21).

     style="--inicio: ⟨inicio⟩; --fim: ⟨fim⟩; --faixa-letras: ⟨letras do tema⟩">
  <p class="kz-faixa-cartao" data-papel="faixa"><span class="kz-faixa-texto">⟨tema⟩</span></p>
  <i class="kz-faixa-cortina"></i><i class="kz-faixa-teto"></i>
</div>
