<!-- cena (K01). Copie bloco.css para a pasta da composição e ponha no <head>:
       <link rel="stylesheet" href="blocos/cena/bloco.css">
     A raiz da composição declara :root { --qps: <o qps do bloco motor-video> }.
     ⟨inicio⟩ e ⟨fim⟩ em quadros; a cena some no ⟨fim⟩ (exclusivo). Cenas seguidas: o ⟨fim⟩ de uma é o ⟨inicio⟩ da
     outra (corte seco). Com transição, a de baixo fica até o fim da transição da de cima. -->
<section class="kz-cena" data-bloco="cena" style="--inicio: ⟨inicio⟩; --fim: ⟨fim⟩">
  <!-- conteúdo da cena; os blocos de dentro herdam o --inicio e o --fim dela -->
</section>
