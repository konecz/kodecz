<!doctype html>
<meta charset="utf-8">
<title>Presenter with captions (comparison case)</title>
<!-- Comparison case «presenter», Kodecz version. A synthetic presenter video (../../../gerar-midia.sh: generated by
     ffmpeg, no person) with its own sound, a lower third with a name and word-by-word captions. The same composition
     as ../hyperframes/index.html and ../remotion/Presenter.tsx: same CSS, same times. It is the 2026-10-30 case of
     docs/medidas.md, unchanged except for these comments. -->
<script type="application/json" id="motor-video">
{ "id": "Presenter", "largura": 1920, "altura": 1080, "qps": 30, "quadros": 150 }
</script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #fff;
               font-family: Inter, sans-serif; }
  .tela { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .tarja { position: absolute; left: 80px; top: 690px; width: 600px; height: 120px; box-sizing: border-box;
           padding: 18px 32px; background: rgba(15, 21, 48, 0.9); border-left: 10px solid #ffb648; border-radius: 8px;
           animation: entra 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both, sai 0.4s cubic-bezier(0.42, 0, 1, 1) 4.3s forwards; }
  @keyframes entra { from { opacity: 0; transform: translateX(-600px); } to { opacity: 1; transform: none; } }
  @keyframes sai { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-600px); } }
  .tarja .nome { font-size: 44px; font-weight: 700; }
  .tarja .cargo { font-size: 26px; color: #c9d4f2; margin-top: 4px; }
  .trecho { position: absolute; left: 0; right: 0; top: 860px; text-align: center; opacity: 0; }
  .caixa { display: inline-block; padding: 16px 32px; border-radius: 16px; background: rgba(0, 0, 0, 0.6);
           font-size: 56px; font-weight: 700; }
  .palavra { opacity: 0.45; }
  .palavra + .palavra { margin-left: 0.3em; }
</style>
<video class="tela" src="apresentador.mp4" data-inicio="0"></video>
<div class="tarja">
  <div class="nome">Apresentador sintético</div>
  <div class="cargo">P07 · gerado pelo ffmpeg, sem pessoa</div>
</div>
<div id="legenda"></div>
<script>
  // Caption lines and words, in seconds. A word is highlighted from its start to the next word's start.
  const LEGENDA = [
    { inicio: 0.3, fim: 1.9, palavras: [['Este', 0.3], ['apresentador', 0.6], ['é', 1.2], ['sintético', 1.4]] },
    { inicio: 1.9, fim: 3.4, palavras: [['a', 1.9], ['legenda', 2.1], ['entra', 2.5], ['palavra', 2.8], ['por', 3.0], ['palavra', 3.1]] },
    { inicio: 3.4, fim: 4.9, palavras: [['e', 3.4], ['o', 3.5], ['som', 3.7], ['é', 4.0], ['um', 4.1], ['tom', 4.3], ['de', 4.5], ['teste', 4.6]] },
  ];
  const ms = (s) => Math.round(s * 1000);
  // No fill: the value holds from start (inclusive) to end (exclusive).
  const durante = (el, valor, inicio, fim) => el.animate([valor, valor], { delay: ms(inicio), duration: ms(fim) - ms(inicio) });
  const legenda = document.getElementById('legenda');
  for (const trecho of LEGENDA) {
    const div = document.createElement('div'), caixa = document.createElement('span');
    div.className = 'trecho';
    caixa.className = 'caixa';
    div.append(caixa);
    legenda.append(div);
    durante(div, { opacity: 1 }, trecho.inicio, trecho.fim);
    trecho.palavras.forEach(([palavra, inicio], k) => {
      const span = document.createElement('span');
      span.className = 'palavra';
      span.textContent = palavra;
      caixa.append(span);
      durante(span, { opacity: 1 }, inicio, trecho.fim);
      const proxima = trecho.palavras[k + 1]?.[1] ?? trecho.fim;
      span.animate([{ color: '#ffd84a' }, { color: '#ffd84a' }], { delay: ms(inicio), duration: ms(proxima) - ms(inicio) });
    });
  }
</script>
