<!doctype html>
<meta charset="utf-8">
<title>Linha com will-change</title>
<!-- R03 com will-change (achado no P13, docs/experimentos/2026-10-p13-paginas-em-paralelo.md, degrau 2): composição
     sintética (R01: nada de cliente) com will-change: transform, opacity no título e nos cartões, que entram andando
     em posição fracionária (2–20), ficam parados (20–36), andam e giram (36–44), param e saem (50–58). Começando no
     meio, o quadro N tem de sair igual ao do render desde o 0. O título está dentro de um bloco com will-change sem
     position: o bloco é o bloco de contenção do título (absolute), como o will-change: transform manda.
     Embaixo (y 440–520): listras com um painel de vidro (backdrop-filter) dentro de uma camada com will-change, que tem
     de continuar borrando as listras; o marco ganha will-change: transform pela classe só do quadro 10 ao 19 (o ponto
     dele, absolute, fica em x 310 nesses quadros e em x 10 nos outros); e um selo com will-change entra pelo
     motor_quadro do quadro 5 em diante. -->
<script type="application/json" id="motor-video">
{ "id": "LinhaWillChange", "largura": 960, "altura": 540, "qps": 30, "quadros": 60 }
</script>
<style>
  /* Fonte embutida (cli/fixtures/fonte-padrao): o quadro não depende das fontes da máquina. */
  @font-face { font-family: 'Teste Sans'; font-weight: 400; src: url('fonte/DejaVuSans.woff2') format('woff2'); }
  @font-face { font-family: 'Teste Sans'; font-weight: 700; src: url('fonte/DejaVuSans-Bold.woff2') format('woff2'); }
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #0d1230; }
  .wc { position: absolute; will-change: transform, opacity; font-family: 'Teste Sans', sans-serif; color: #fff; }
  .bloco { margin-left: 40px; will-change: transform; }
  .titulo { left: 60px; top: 60px; font-size: 56px; font-weight: 700; letter-spacing: -1px; }
  .cartao { top: 280px; width: 180px; height: 120px; border-radius: 18px; border: 2px solid rgba(255, 255, 255, 0.4);
    box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; }
  .listras { position: absolute; left: 0; top: 440px; width: 960px; height: 80px;
    background: repeating-linear-gradient(90deg, #f33 0 8px, #33f 8px 16px); }
  .painel { position: absolute; left: 500px; top: 440px; width: 300px; height: 80px; will-change: transform; }
  .vidro { position: absolute; inset: 10px; backdrop-filter: blur(10px); }
  .marco { margin-left: 300px; height: 0; }
  .ativo { will-change: transform; }
  .ponto { position: absolute; left: 10px; top: 420px; width: 12px; height: 12px; background: #3f3; }
  .selo { position: absolute; left: 820.4px; top: 20px; will-change: transform; font: 700 20px 'Teste Sans', sans-serif; color: #ff3; }
</style>
<div class="listras"></div>
<div class="painel"><div class="vidro"></div></div>
<div class="marco" id="marco"><div class="ponto"></div></div>
<!-- O bloco desloca o título 40 px para a direita (x 100) só se for o bloco de contenção dele. -->
<div class="bloco"><div class="wc titulo" id="titulo">Cena com camadas</div></div>
<script>
  const ms = (q) => (q * 1000) / 30, curva = 'cubic-bezier(0.16, 1, 0.3, 1)';
  // Cada propriedade é uma trilha: o primeiro trecho preenche para trás (both), os outros para a frente.
  const trilha = (el, prop, inicial, trechos) => {
    el.style[prop] = inicial;
    let de = inicial;
    trechos.forEach(([q, dur, para], i) => {
      el.animate([{ [prop]: de }, { [prop]: para }], { delay: ms(q), duration: ms(dur), fill: i === 0 ? 'both' : 'forwards', easing: curva });
      de = para;
    });
  };
  const titulo = document.getElementById('titulo');
  trilha(titulo, 'opacity', '0', [[2, 18, '1'], [50, 8, '0']]);
  trilha(titulo, 'transform', 'translateY(37px)', [[2, 18, 'translateY(0px)'], [50, 8, 'translateY(-23px)']]);
  ['Um', 'Dois', 'Três', 'Quatro'].forEach((nome, i) => {
    const d = document.createElement('div');
    d.className = 'wc cartao';
    d.textContent = nome;
    // O último cartão tem fundo opaco (o texto numa camada opaca pode sair com subpixel).
    Object.assign(d.style, { left: `${60 + i * 220}px`, background: `hsl(${200 + i * 30} 60% 45% / ${i === 3 ? 1 : 0.55})` });
    document.body.append(d);
    trilha(d, 'opacity', '0', [[4 + i * 2, 16, '1'], [50 + i, 8, '0']]);
    trilha(d, 'transform', 'translate(143px, 0px) rotate(0deg)', [[4 + i * 2, 16, 'translate(0px, 0px) rotate(0deg)'],
      [36 + i * 2, 8, `translate(0px, -37px) rotate(${i % 2 ? 3 : -3}deg)`]]);
  });
  // Mudanças pelo gancho do motor, depois da carga: a classe do marco e o selo novo.
  const marco = document.getElementById('marco');
  window.motor_quadro = (n) => {
    marco.classList.toggle('ativo', n >= 10 && n < 20);
    const selo = document.getElementById('selo');
    if (n < 5) selo?.remove();
    else if (!selo) {
      const s = document.createElement('div');
      s.id = 'selo'; s.className = 'selo'; s.textContent = 'R03';
      document.body.append(s);
    }
  };
</script>
