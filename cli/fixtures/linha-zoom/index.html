<title>Zoom na placa</title>
<!-- S08, escala ≠ 1: composição sintética (R01) para o vídeo ampliado, reduzido e com zoom animado montado na placa.
     O vídeo (o teste gera na hora o video.mp4: testsrc2 do ffmpeg, 1920×1080, 25 q/s) aparece em sete casos de 6
     quadros, um vídeo por caso, num palco de fundo opaco, com uma tarja semitransparente por cima:
       A (0–5)   ampliado pelo tamanho no CSS (2112×1188) em posição fracionária;
       B (6–11)  transform: scale(1.15), com a origem da caixa em meio pixel negativo;
       C (12–17) zoom animado (scale 1 → 1,2) dentro de uma coluna recortada (overflow) em pixel inteiro;
       D (18–23) reduzido à metade, com as bordas no pixel;
       E (24–29) reduzido com tamanho e posição fracionários (o Chromium arredonda as bordas);
       F (30–35) sem escala, em posição fracionária (idem);
       G (36–39) scale(0.77): a borda visível cai fora do pixel e vai pelo canvas (o Chromium a suaviza);
       H (40–43) `scale` solto num ancestral, com o vídeo no pixel: vai pelo canvas (escala fora do vídeo);
       I (44–47) só translação de meio pixel no vídeo: vai pelo canvas (posição fora do pixel).
     O mesmo quadro tem de sair igual pelos dois caminhos (MOTOR_TAKE_PLACA=0 e o padrão), dentro da régua do R03. -->
<script type="application/json" id="motor-video">
{ "id": "LinhaZoom", "largura": 1920, "altura": 1080, "qps": 25, "quadros": 48 }
</script>

  .d { left: 100px; top: 100px; width: 960px; height: 540px; }
