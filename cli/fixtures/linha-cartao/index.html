<!-- S08, recorte arredondado: composição sintética (R01) com o vídeo dentro de um cartão de canto arredondado
     (`overflow: hidden` e `border-radius`), como o cartão da apresentadora do C02. O teste gera na hora o video.mp4
     (testsrc2 do ffmpeg, 1920×1080, 25 q/s). Cada caso tem o seu cartão, visível só nos quadros dele:
       A (0–9)   raio 32, sombra e contorno, vídeo reduzido em posição fracionária, tarja por cima no meio do cartão;
       B (10–19) raio 24,6 (fracionário), sem sombra, o vídeo no tamanho dele (o texel direto);
       C (20–29) raio 32, sombra e contorno, zoom animado no vídeo (transform: scale);
       D (30–33) raio 32 com uma tarja posicionada por cima do canto: vai pelo canvas;
       E (34–37) cantos elípticos (32px / 16px): vai pelo canvas;
       F (38–39) cartão em posição fracionária: vai pelo canvas;
       G (40–43) raio 32, sombra e contorno, com o fundo de uma legenda quase opaca (92 %) cobrindo o canto de baixo à
                 direita, o texto longe do canto: pela placa (o núcleo separa o fundo da legenda do que está por baixo);
       H (44–47) o mesmo com o texto da legenda passando pelo canto: pela placa, com a exceção do R03 (a letra na
                 faixa do canto não se separa do fundo: até 3 níveis em até 2 pixels, no canto; responsável, 2026-11-01);
       I (48–51) o caso G com uma tarja posicionada antes da legenda no mesmo canto: vai pelo canvas (no canto coberto,
                 só a legenda pode estar por cima);
       J (52–55) contorno de dentro no cartão (`outline-offset` negativo, pintado por cima do vídeo): vai pelo canvas;
       K (56–59) um cursor em SVG com `filter: drop-shadow` dentro do cartão, no quadrado do canto de baixo à direita mas
                 longe da faixa do canto (o alcance da sombra é medido): pela placa;
       L (60–63) uma tarja opaca dentro do cartão, cruzando o quadrado do canto de baixo à direita sem chegar à faixa
                 (ali a cobertura é 1 e a mistura é a de sempre): pela placa;
       M (64–67) o cursor do K sem filtro próprio, dentro de um contêiner com `filter: drop-shadow` longe do canto: a
                 sombra do cursor (pintada pelo contêiner) chega à faixa do canto, então vai pelo canvas.
     O mesmo quadro tem de sair igual pelos dois caminhos (MOTOR_TAKE_PLACA=0 e o padrão), dentro da régua do R03 (com a
     exceção do canto com texto no caso H). -->
